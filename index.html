<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tienda de Mascotas para personas de la tercena edad.</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #fff3e0;
            color: #333;
        }
        .carousel {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }
        .carousel img {
            width: 100%;
            height: auto;
            display: block;
        }
        .products {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .product {
            display: inline-block;
            margin: 20px;
            border: 2px solid #ffcc00;
            padding: 10px;
            width: 200px;
            text-align: center;
        }
        .product h3 {
            color: #ff4d4d;
        }
    </style>
</head>
<body>
    <div class="carousel">
        <img src="images/pet1.jpg" alt="Perro">
    </div>
    <div class="products">
        <div class="product">
            <h3>Perro</h3>
            <p>15€</p>
        </div>
        <div class="product">
            <h3>Gato</h3>
            <p>20€</p>
        </div>
        <div class="product">
            <h3>Hamster</h3>
            <p>10€</p>
        </div>
    </div>
</body>
</html>
